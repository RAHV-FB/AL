# Build, test and deploy the single-file app (dist/index.html) to GitHub Pages.
# Repo settings → Pages → Source must be "GitHub Actions".
# Live URL: https://rahv-fb.github.io/AL/
name: Deploy to GitHub Pages

on:
  push:
    # The repository's default branch is the feature branch until a `main` exists.
    branches: [main, 'claude/artificial-life-simulator-8iuk86']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (typecheck + vite single-file build)
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
